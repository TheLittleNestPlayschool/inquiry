<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inquiries</title>

    <link
        rel="stylesheet"
        href="main.css"
    >

</head>


<body>

    <main class="page">

        <header class="page-header">

            <div>

                <h1 class="page-title">
                    Inquiries
                </h1>

                <p class="page-subtitle">
                    Manage parent inquiries and conversations.
                </p>

            </div>


            <button
                type="button"
                class="new-inquiry-button"
                id="newInquiryButton"
            >
                + New Inquiry
            </button>

        </header>


        <section class="inquiry-panel">

            <div class="empty-state">

                <div class="empty-state-content">

                    <h2 class="empty-state-title">
                        No inquiries yet
                    </h2>

                    <p class="empty-state-text">
                        Create a new inquiry to begin tracking a parent
                        and their conversation with the playschool.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================================
         New Inquiry Modal
    ========================================== -->

    <div
        id="newInquiryModal"
        class="modal"
        aria-hidden="true"
    >

        <div class="modal-card">

            <div class="modal-header">

                <div>

                    <h2>
                        New Inquiry
                    </h2>

                    <p>
                        Enter the basic information for this inquiry.
                    </p>

                </div>


                <button
                    type="button"
                    class="modal-close"
                    id="closeInquiryModal"
                    aria-label="Close"
                >
                    ×
                </button>

            </div>


            <div class="form">

                <div class="form-group">

                    <label for="parentName">
                        Parent / Client Name
                    </label>

                    <input
                        type="text"
                        id="parentName"
                        placeholder="Enter parent or client name"
                    >

                </div>


                <div class="form-group">

                    <label for="franchise">
                        Franchise / Branch
                    </label>

                    <select id="franchise">

                        <option value="">
                            Select a branch
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="contactNumber">
                        Contact Number
                    </label>

                    <input
                        type="text"
                        id="contactNumber"
                        placeholder="Enter contact number"
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="childName">
                            Child Name
                        </label>

                        <input
                            type="text"
                            id="childName"
                            placeholder="Enter child's name"
                        >

                    </div>


                    <div class="form-group">

                        <label for="childAge">
                            Child Age
                        </label>

                        <input
                            type="text"
                            id="childAge"
                            placeholder="Age"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="inquirySource">
                        Source
                    </label>

                    <select id="inquirySource">

                        <option value="">
                            Select source
                        </option>

                        <option value="facebook">
                            Facebook
                        </option>

                        <option value="walk_in">
                            Walk-in
                        </option>

                        <option value="referral">
                            Referral
                        </option>

                        <option value="phone">
                            Phone
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="button-secondary"
                    id="cancelInquiry"
                >
                    Cancel
                </button>


                <button
                    type="button"
                    class="button-primary"
                    id="createInquiry"
                >
                    Create Inquiry
                </button>

            </div>

        </div>

    </div>


    <script>

        const newInquiryButton =
            document.getElementById(
                'newInquiryButton'
            );


        const newInquiryModal =
            document.getElementById(
                'newInquiryModal'
            );


        const closeInquiryModal =
            document.getElementById(
                'closeInquiryModal'
            );


        const cancelInquiry =
            document.getElementById(
                'cancelInquiry'
            );


        function openInquiryModal(){

            newInquiryModal.classList.add(
                'is-open'
            );

            newInquiryModal.setAttribute(
                'aria-hidden',
                'false'
            );

        }


        function closeInquiry(){

            newInquiryModal.classList.remove(
                'is-open'
            );

            newInquiryModal.setAttribute(
                'aria-hidden',
                'true'
            );

        }


        newInquiryButton.addEventListener(
            'click',
            openInquiryModal
        );


        closeInquiryModal.addEventListener(
            'click',
            closeInquiry
        );


        cancelInquiry.addEventListener(
            'click',
            closeInquiry
        );


        newInquiryModal.addEventListener(
            'click',
            (event)=>{

                if(
                    event.target ===
                    newInquiryModal
                ){

                    closeInquiry();

                }

            }
        );

    </script>

</body>

</html>
