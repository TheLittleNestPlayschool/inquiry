<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inquiries</title>

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#f5f7fa;
            color:#1f2937;
        }

        .page{
            max-width:1400px;
            margin:0 auto;
            padding:32px;
        }

        .page-header{
            display:flex;
            align-items:center;
            justify-content:space-between;
            margin-bottom:28px;
        }

        .page-title{
            margin:0;
            font-size:28px;
            font-weight:600;
        }

        .page-subtitle{
            margin:6px 0 0;
            color:#6b7280;
            font-size:14px;
        }

        .new-inquiry-button{
            border:0;
            border-radius:10px;
            padding:12px 18px;
            background:#1f2937;
            color:white;
            font-size:14px;
            font-weight:600;
            cursor:pointer;
        }

        .new-inquiry-button:hover{
            opacity:.9;
        }

        .inquiry-panel{
            background:white;
            border:1px solid #e5e7eb;
            border-radius:14px;
            min-height:400px;
            padding:24px;
        }

        .empty-state{
            min-height:350px;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
        }

        .empty-state-content{
            max-width:420px;
        }

        .empty-state-title{
            margin:0 0 8px;
            font-size:18px;
            font-weight:600;
        }

        .empty-state-text{
            margin:0;
            color:#6b7280;
            font-size:14px;
            line-height:1.5;
        }

    </style>
</head>

<body>

    <main class="page">

        <header class="page-header">

            <div>
                <h1 class="page-title">
                    Inquiries
                </h1>

                <p class="page-subtitle">
                    Manage parent inquiries and conversations.
                </p>
            </div>

            <button
                type="button"
                class="new-inquiry-button"
                id="newInquiryButton"
            >
                + New Inquiry
            </button>

        </header>


        <section class="inquiry-panel">

            <div class="empty-state">

                <div class="empty-state-content">

                    <h2 class="empty-state-title">
                        No inquiries yet
                    </h2>

                    <p class="empty-state-text">
                        Create a new inquiry to begin tracking a parent
                        and their conversation with the playschool.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <script>

        const newInquiryButton =
            document.getElementById(
                'newInquiryButton'
            );

        newInquiryButton.addEventListener(
            'click',
            ()=>{
                console.log(
                    'New inquiry'
                );
            }
        );

    </script>

</body>
</html>
