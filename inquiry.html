<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inquiries</title>


    <!-- Shared Application Background -->

    <link
        rel="stylesheet"
        href="background.css"
    >


    <!-- Inquiry Page Styles -->

    <link
        rel="stylesheet"
        href="inquiry.css"
    >

</head>


<body>


    <!-- ==========================================
         SHARED APPLICATION BACKGROUND
    =========================================== -->

    <div
        class="app-background"
        aria-hidden="true"
    >

        <div class="gradient-overlay"></div>

    </div>


    <!-- ==========================================
         INQUIRY APPLICATION
    =========================================== -->

    <main class="page">


        <!-- ======================================
             PAGE HEADER
        ======================================= -->

        <header class="page-header">

            <div>

                <h1 class="page-title">
                    Inquiries
                </h1>

                <p class="page-subtitle">
                    Manage parent inquiries and conversations.
                </p>

            </div>


            <button
                id="newInquiryButton"
                class="new-inquiry-button"
                type="button"
            >
                + New Inquiry
            </button>

        </header>


        <!-- ======================================
             INQUIRY LIST
        ======================================= -->

        <section
            id="inquiryPanel"
            class="inquiry-panel"
        >

            <div
                id="emptyState"
                class="empty-state"
            >

                <div class="empty-state-content">

                    <h2 class="empty-state-title">
                        No inquiries yet
                    </h2>

                    <p class="empty-state-text">
                        Create a new inquiry to begin tracking a parent and their conversation with the playschool.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- ==========================================
         NEW INQUIRY MODAL
    =========================================== -->

    <div
        id="inquiryModal"
        class="modal"
        aria-hidden="true"
    >

        <div
            class="modal-card"
            role="dialog"
            aria-modal="true"
            aria-labelledby="newInquiryTitle"
        >


            <!-- Modal Header -->

            <div class="modal-header">

                <div>

                    <h2 id="newInquiryTitle">
                        New Inquiry
                    </h2>

                    <p>
                        Enter the basic information for this inquiry.
                    </p>

                </div>


                <button
                    id="closeInquiryModal"
                    class="modal-close"
                    type="button"
                    aria-label="Close"
                >
                    ×
                </button>

            </div>


            <!-- ==================================
                 FORM
            =================================== -->

            <form
                id="inquiryForm"
                class="form"
            >


                <!-- Parent / Client -->

                <div class="form-group">

                    <label
                        for="parentName"
                    >
                        Parent / Client Name
                    </label>

                    <input
                        type="text"
                        id="parentName"
                        name="parent_name"
                        placeholder="Enter parent or client name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- Franchise -->

                <div class="form-group">

                    <label
                        for="franchiseSelect"
                    >
                        Franchise / Branch
                    </label>

                    <select
                        id="franchiseSelect"
                        name="franchise_id"
                        required
                    >

                        <option value="">
                            Select a branch
                        </option>

                    </select>

                </div>


                <!-- Source -->

                <div class="form-group">

                    <label
                        for="source"
                    >
                        Source
                    </label>

                    <input
                        type="text"
                        id="source"
                        name="source"
                        value="Facebook"
                        readonly
                    >

                </div>


            </form>


            <!-- ==================================
                 MODAL FOOTER
            =================================== -->

            <div class="modal-footer">

                <button
                    id="cancelInquiryButton"
                    class="button-secondary"
                    type="button"
                >
                    Cancel
                </button>


                <button
                    id="createInquiryButton"
                    class="button-primary"
                    type="submit"
                    form="inquiryForm"
                >
                    Create Inquiry
                </button>

            </div>

        </div>

    </div>


    <!-- ==========================================
         INQUIRY JAVASCRIPT
    =========================================== -->

    <script
        src="inquiry.js"
    ></script>

</body>

</html>
