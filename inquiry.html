<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inquiries</title>

    <!-- Shared Application Background -->
    <link
        rel="stylesheet"
        href="background.css"
    >

    <!-- Inquiry Page Styles -->
    <link
        rel="stylesheet"
        href="inquiry.css"
    >

    <link
        rel="stylesheet"
        href="inquiry_cards.css"
    >

    <link
        rel="stylesheet"
        href="inquiry_gauge.css"
    >

    <link
        rel="stylesheet"
        href="inquiry_modal.css"
    >

</head>

<body>

    <!-- Shared Application Background -->
    <div
        class="app-background"
        aria-hidden="true"
    >
        <div class="gradient-overlay"></div>
    </div>

    <!-- Inquiry Application -->
    <main class="page">

        <!-- Page Header -->
        <header class="page-header">

            <h1 class="page-title">
                Inquiries
            </h1>

            <div class="page-header-actions">

                <button
                    id="lookupClosedButton"
                    class="lookup-closed-button"
                    type="button"
                >
                    Find Closed Conversation
                </button>

                <button
                    id="newInquiryButton"
                    class="new-inquiry-button"
                    type="button"
                >
                    + New Inquiry
                </button>

            </div>

        </header>

        <!-- Inquiry List -->
        <section
            id="inquiryPanel"
            class="inquiry-panel"
        >

            <div
                id="emptyState"
                class="empty-state"
            >

                <div class="empty-state-content">

                    <h2 class="empty-state-title">
                        Loading inquiries...
                    </h2>

                    <p class="empty-state-text">
                        Loading active inquiries.
                    </p>

                </div>

            </div>

        </section>

    </main>

    <!-- New Inquiry Modal -->
    <div
        id="inquiryModal"
        class="modal"
        aria-hidden="true"
    >

        <div
            class="modal-card"
            role="dialog"
            aria-modal="true"
            aria-labelledby="newInquiryTitle"
        >

            <!-- Modal Header -->
            <div class="modal-header">

                <div>
                    <h2 id="newInquiryTitle">
                        New Inquiry
                    </h2>

                    <p>
                        Enter the basic information for this inquiry.
                    </p>
                </div>

                <button
                    id="closeInquiryModal"
                    class="modal-close"
                    type="button"
                    aria-label="Close"
                >
                    ×
                </button>

            </div>

            <!-- Form -->
            <form
                id="inquiryForm"
                class="form"
            >

                <div class="form-group">

                    <label for="parentName">
                        Parent / Client Name
                    </label>

                    <input
                        type="text"
                        id="parentName"
                        name="parent_name"
                        placeholder="Enter parent or client name"
                        autocomplete="name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="franchiseSelect">
                        Franchise / Branch
                    </label>

                    <select
                        id="franchiseSelect"
                        name="franchise_id"
                        required
                    >

                        <option value="">
                            Loading branches...
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="source">
                        Source
                    </label>

                    <input
                        type="text"
                        id="source"
                        name="source"
                        value="Facebook"
                        readonly
                    >

                </div>

            </form>

            <!-- Modal Footer -->
            <div class="modal-footer">

                <button
                    id="cancelInquiryButton"
                    class="button-secondary"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    id="createInquiryButton"
                    class="button-primary"
                    type="submit"
                    form="inquiryForm"
                >
                    Create Inquiry
                </button>

            </div>

        </div>

    </div>

    <!-- Inquiry Application -->
    <script
        type="module"
        src="inquiry.js"
    ></script>

</body>

</html>
