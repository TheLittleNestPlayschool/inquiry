<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inquiries</title>

    <link
        rel="stylesheet"
        href="background.css"
    >

    <link
        rel="stylesheet"
        href="inquiry.css"
    >

</head>


<body>

    <main class="page">

        <header class="page-header">

            <div>

                <h1 class="page-title">
                    Inquiries
                </h1>

                <p class="page-subtitle">
                    Manage parent inquiries and conversations.
                </p>

            </div>


            <button
                type="button"
                class="new-inquiry-button"
                id="newInquiryButton"
            >
                + New Inquiry
            </button>

        </header>


        <section
            class="inquiry-panel"
            id="inquiryPanel"
        >

            <div
                class="empty-state"
                id="emptyState"
            >

                <div class="empty-state-content">

                    <h2 class="empty-state-title">
                        No inquiries yet
                    </h2>

                    <p class="empty-state-text">
                        Create a new inquiry to begin tracking a parent
                        and their conversation with the playschool.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- New Inquiry Modal -->

    <div
        id="newInquiryModal"
        class="modal"
        aria-hidden="true"
    >

        <div class="modal-card">

            <div class="modal-header">

                <div>

                    <h2>
                        New Inquiry
                    </h2>

                    <p>
                        Enter the basic information for this inquiry.
                    </p>

                </div>


                <button
                    type="button"
                    class="modal-close"
                    id="closeInquiryModal"
                    aria-label="Close"
                >
                    ×
                </button>

            </div>


            <div class="form">

                <div class="form-group">

                    <label for="parentName">
                        Parent / Client Name
                    </label>

                    <input
                        type="text"
                        id="parentName"
                        placeholder="Enter parent or client name"
                    >

                </div>


                <div class="form-group">

                    <label for="franchise">
                        Franchise / Branch
                    </label>

                    <select id="franchise">

                        <option value="">
                            Loading branches...
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="inquirySource">
                        Source
                    </label>

                    <input
                        type="text"
                        id="inquirySource"
                        value="Facebook"
                        readonly
                    >

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="button-secondary"
                    id="cancelInquiry"
                >
                    Cancel
                </button>


                <button
                    type="button"
                    class="button-primary"
                    id="createInquiry"
                >
                    Create Inquiry
                </button>

            </div>

        </div>

    </div>


    <script src="inquiry.js"></script>

</body>

</html>
